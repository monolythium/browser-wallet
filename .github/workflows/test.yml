name: Test

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check types
        run: pnpm typecheck

      - name: Run full test suite
        run: pnpm test

      - name: Build production extension
        run: pnpm build

      - name: Inspect production output
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VERSION=$(node -p "require('./manifest.json').version")
          BUILT_VERSION=$(node -p "require('./dist/manifest.json').version")
          test "$SOURCE_VERSION" = "$BUILT_VERSION"
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "::error::Production extension contains source maps"
            exit 1
          fi
          if find dist -type l -print -quit | grep -q .; then
            echo "::error::Production extension contains symbolic links"
            exit 1
          fi
